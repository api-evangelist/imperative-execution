aid: imperative-execution
name: Imperative Execution
description: 'Imperative Execution is a New York financial technology company and the
  parent of IntelligentCross, an SEC-registered US equities Alternative Trading System
  (ATS) that applies machine learning to order matching and price discovery. IntelligentCross
  operates a non-displayed Midpoint book and ASPEN, a full limit order book with optional
  displayed capability that is split into three independent books by fee model (Fee/Fee,
  Maker/Taker, Taker/Maker), all under MPID INCR, with primary matching engines in the
  Equinix NY4 data center in Secaucus, New Jersey. Registered broker-dealer subscribers
  reach the venue for order entry over FIX 4.2 across Pico cross-connects, and the venue
  publishes its own IQX market data feed - a binary, multicast-UDP full depth-of-book
  and execution feed whose message specification, recovery/rerequest specification,
  daily symbol mapping file and sample PCAP captures are all published openly.'
image: https://cdn.prod.website-files.com/5ee92e3bd621402efc7f2d3f/67e1c4d359b8c0966be92f8d_intelligentCross-logo.png
