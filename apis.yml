apis:
- name: IntelligentCross IQX Market Data Feed
  description: 'IQX is the IntelligentCross proprietary market data feed. It disseminates
    all visible ASPEN resting orders, cancels for ASPEN visible orders, and all ASPEN
    executions, plus per-symbol reference data, market state and individual symbol
    trading states. It is a binary protocol carried over multicast UDP with separate
    primary (A) and secondary (B) groups per book, and a separate published rerequest/recovery
    specification. IntelligentCross does not charge for market data through IQX.'
  humanURL: https://www.imperativex.com/market-data
  baseURL: https://s3.amazonaws.com/iqx.imperativex.com/
  x-transport: multicast UDP (binary). The HTTPS baseURL is the published IQX resource
    host that serves the daily symbol mapping file and the sample PCAP captures.
  tags:
  - Market Data
  - Equities
  - Multicast
  - Binary Protocol
  - Depth of Book
  properties:
  - type: Documentation
    url: https://www.imperativex.com/market-data
  - type: APIReference
    name: IntelligentCross Market Data Feed Specification v1.11
    url: http://iqx.imperativex.com/IntelligentCrossMarketDataFeedSpec.v.1.11.pdf
  - type: Specification
    name: IntelligentCross IQX Market Data Rerequest Specification v1.08
    url: https://cdn.prod.website-files.com/5ee92e3bd6214065dc7f2d48/61dc6cb50403bf15350ea647_IntelligentCross%20IQX%20Market%20Data%20Rerequest%20Specification%20v1.08.pdf
  - type: AsyncAPI
    url: asyncapi/imperative-execution-iqx-asyncapi.yml
  - type: Examples
    url: examples/imperative-execution-iqx-sample-data.yml
- name: IntelligentCross FIX Order Entry API
  description: 'Order entry into the IntelligentCross ATS books (Midpoint, ASPEN Fee/Fee,
    ASPEN Maker/Taker, ASPEN Taker/Maker) is accepted only over FIX connections; the
    ATS currently supports FIX 4.2. Subscribers must be registered US broker-dealers
    in good standing with an SRO, and reach the matching engines through NY4 cross-connects
    or a network service provider with an NY4 presence. Book selection is affirmative
    via the FIX ExDestination[100] tag and defaults to ASPEN Fee/Fee. The FIX specification
    is provided to subscribers on request from ops@intelligentcross.com.'
  humanURL: https://www.imperativex.com/faq
  baseURL: https://www.imperativex.com/contact
  x-protocol: FIX 4.2
  x-transport: FIX over TCP on private cross-connects at Equinix NY4 (Secaucus, NJ).
    There is no public HTTP endpoint - the baseURL points at the documented onboarding
    and specification-request surface.
  x-access: subscriber-only (registered US broker-dealers)
  tags:
  - Trading
  - Order Entry
  - FIX Protocol
  - Equities
  - Alternative Trading System
