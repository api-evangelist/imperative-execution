summary: 'IntelligentCross is a regulated US equities market-infrastructure operator, so its
  conformance surface is regulatory and industry-protocol rather than web-API. It conforms to
  FIX 4.2 for order entry, files and maintains an effective Form ATS-N under Rule 304 of
  Regulation ATS, operates under Reg NMS with executions inside the NBBO protected quote range,
  is registered with ISO 10383 market identifier codes, and its operating subsidiary is a FINRA
  and SIPC member. None of the web-API standards families (OAuth 2.0, OIDC, RFC 9457, JSON:API,
  OData, SCIM, FHIR) apply - there is no HTTP API.'
standards:
