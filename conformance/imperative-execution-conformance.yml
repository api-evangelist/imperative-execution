  conforms: true
  evidence: 'IntelligentCross FAQ: subscribers access the ATS via a FIX connection compliant
    with the FIX API provided by IntelligentCross; the ATS currently supports FIX 4.2. Book
    routing uses the standard ExDestination (tag 100) field; the order acknowledgment (38=8,
    150=0) returns OrderID in tag 37.'
  source: https://www.imperativex.com/faq
- id: regulation-ats
