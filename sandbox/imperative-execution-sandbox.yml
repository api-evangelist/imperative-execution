summary: 'IntelligentCross publishes a UAT (user acceptance test) environment for its
  IQX market data feed alongside production, with its own multicast groups, ports and
  feed identifiers, all documented in the public Market Data Feed Specification v1.11.
  It also publishes downloadable sample data - a full-day PCAP capture of the feed and
  the daily pipe-delimited symbol mapping file - so a consumer can build and validate
  a decoder before requesting connectivity. There is no public self-service sandbox
  for order entry: FIX access requires a subscriber agreement and a cross-connect.'
